---
- name: Configure Debian Homeserver
  hosts: home_server
  become: true

  vars:
    ssh_port: "{{ lookup('env', 'ANSIBLE_PORT') }}"
    timezone: "Europe/Berlin"

  pre_tasks:
    - name: Ensure apt is updated
      apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - security
    - cosmetic
    - docker
    - pihole