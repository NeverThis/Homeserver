---
- name: Configure Debian Homeserver
  hosts: home_server
  become: true

  vars:
    domain: "myhome.lan"
    ssh_port: "{{ lookup('env', 'ANSIBLE_PORT') }}"
    timezone: "Europe/Berlin"

  pre_tasks:
    - name: Ensure running on Debian
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
    - name: Ensure apt is updated
      apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - security
    - essentials
    - cosmetic
    - pihole
    - caddy
    - gitea