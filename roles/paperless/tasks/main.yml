---
- name: Create Paperless directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - /srv/paperless
    - /srv/paperless/data
    - /srv/paperless/data/data
    - /srv/paperless/data/media
    - /srv/paperless/data/export
    - /srv/paperless/data/consume
    - /srv/paperless/redis
    - /srv/paperless/db

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /srv/paperless/docker-compose.yml
    owner: root
    group: root
    mode: "0640"

# Install Paperless as a document management system
- name: Start Paperless
  community.docker.docker_compose_v2:
    project_src: /srv/paperless
    pull: always
    state: present
