---
# Install fastfetch to display system information
- name: Install fastfetch
  ansible.builtin.apt:
    name: fastfetch
    state: present

- name: Configure fastfetch to run automatically on SSH login
  ansible.builtin.template:
    src: fastfetch.sh.j2
    dest: /etc/profile.d/fastfetch.sh
    mode: "0644"
